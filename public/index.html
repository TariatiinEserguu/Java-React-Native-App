<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!-- Paints the saved (or system) theme and sets the saved language before the app bundle loads, so there is no light flash in dark mode. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('pharmacare.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.style.backgroundColor = theme === 'dark' ? '#0E1618' : '#F4F7F7';
          root.style.colorScheme = theme;
          root.dataset.theme = theme;
          var language = localStorage.getItem('pharmacare.language');
          root.lang = language === 'en' ? 'en' : 'mn';
        } catch (e) {}
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
